name: DIDS CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit and produce build
        run: python scripts/dids.py build
      - name: Upload QA reports and test build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dids-ci-${{ github.run_number }}
          path: |
            reports/
            dist/*.zip
          if-no-files-found: warn
          retention-days: 14
